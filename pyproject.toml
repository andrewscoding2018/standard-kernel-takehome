[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fp4_kernel"
version = "0.1.0"
description = "FP4 quantized linear kernel for transformer inference"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "triton",
    "numpy",
    "transformers",
    "pytest",
    "matplotlib",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fp4_kernel*", "test*"]